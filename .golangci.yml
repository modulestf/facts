version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - gosec
    - misspell
    - modernize
    - revive
    - unconvert
  settings:
    errcheck:
      # Output to the CLI's writers and to hashes; a failed write to stdout
      # is caught where the report is written.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    revive:
      # Listing rules replaces revive's defaults, so the defaults are listed
      # here. exported is off: every package is internal or main.
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming
  exclusions:
    rules:
      # The CLI opens the paths its user names; tree reads go through os.Root.
      - linters: [gosec]
        text: "G304:"
      # Tests create fixture trees, and restore their modes, with ordinary permissions.
      - linters: [gosec]
        path: _test\.go$
        text: "G30[126]:"
      # Deferred Close on files and directories opened read-only.
      - linters: [errcheck]
        source: '^\s*defer \w+\.Close\(\)$'
