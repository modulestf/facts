repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.106.0
    hooks:
      - id: terraform_fmt
      - id: terraform_wrapper_module_for_each
  - repo: https://github.com/someone/fork
    rev: v1.105.0
    hooks:
      - id: terraform_wrapper_module_for_each
