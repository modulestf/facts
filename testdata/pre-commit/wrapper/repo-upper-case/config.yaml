repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.108.1
    hooks:
      - id: terraform_fmt
      - id: terraform_wrapper_module_for_each
  - repo: https://github.com/ANTONBABENKO/PRE-COMMIT-TERRAFORM
    rev: v1.100.0
