name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  # The rule registry pin, used by the Fetch rule registry step of each job.
  SKILLS_COMMIT: 19d74e317b5721d14d384bc01699fa97379f21e3
  REGISTRY_SHA256: e43644044fb373209cad6e208b5119224e06361b7b9b5c698e0cd35507c77f54

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          # The module and build caches, keyed on go.sum. Pull request runs
          # read the master cache and write only their own; release.yml keeps
          # cache: false, so no cache reaches a release build.
          cache: true
      - name: Check modules
        env:
          GOFLAGS: ""
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code go.mod go.sum
      # go run at a pinned version: the module and its build come from the
      # setup-go cache after the first run, not a new download each time.
      - name: Vulnerabilities
        env:
          GOFLAGS: ""
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      # A released feature name of version --json is never removed.
      - name: Feature names kept
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "refs/heads/${BASE_REF}"
          bash scripts/check-features-kept.sh FETCH_HEAD
      - name: Vet
        run: go vet ./...
      # Releases ship 64-bit binaries, but the code and its tests must still
      # build where an integer type is narrower or a syscall is missing.
      - name: Cross builds
        run: |
          GOOS=linux GOARCH=386 go build ./...
          GOOS=linux GOARCH=arm go build ./...
          GOOS=solaris GOARCH=amd64 go vet ./...
          GOOS=aix GOARCH=ppc64 go vet ./...
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      # The rule registry, from the public modulestf repository at a pinned
      # commit, with no token. TestRulesMatchPinnedRegistry checks the
      # `mtf-facts rules` listing against it. A registry change is published
      # there first and then picked up here by bumping the commit and the
      # file's SHA-256 together. The hash check refuses a cut-off download.
      - name: Fetch rule registry
        run: |
          curl -fsSL --proto '=https' --tlsv1.2 --retry 2 --max-time 30 \
            -o "$RUNNER_TEMP/rule-facts.md" \
            "https://raw.githubusercontent.com/modulestf/modulestf/${SKILLS_COMMIT}/.agents/skills/terraform-module-reviewer/references/rule-facts.md"
          echo "${REGISTRY_SHA256}  ${RUNNER_TEMP}/rule-facts.md" | sha256sum -c -
      - name: Test
        env:
          MTF_FACTS_REGISTRY: ${{ runner.temp }}/rule-facts.md
        run: go test -race -count=1 -coverprofile="$RUNNER_TEMP/cover.out" ./...
      # Reported in the job summary only; no threshold fails the job.
      - name: Coverage
        run: |
          total=$(go tool cover -func="$RUNNER_TEMP/cover.out" | tail -1)
          echo "$total"
          printf 'Coverage %s\n' "$total" >>"$GITHUB_STEP_SUMMARY"
      - name: Build
        run: go build -trimpath -o bin/mtf-facts ./cmd/mtf-facts
      # ajv-cli and its dependencies come from tests/ajv/package-lock.json,
      # installed by npm ci from the public registry with no token. The
      # image's Node.js is used on purpose: ajv-cli 5 runs on any current Node.
      - name: Schemas
        run: bash tests/schemas-test.sh

  # Benchmarks of the pull request head and of its base, compared by
  # benchstat in the job summary. Shared runners are noisy, so the job only
  # reports and never fails the build. A base with no bench target, or one
  # that cannot be checked out, gives an empty base column; a failed run is
  # named in the summary.
  bench:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Benchmarks on the base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          : > "$RUNNER_TEMP/base.txt"
          if ! git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"; then
            echo "Base benchmarks skipped: the base commit could not be checked out." >> "$RUNNER_TEMP/notes.md"
          elif ! grep -q '^bench:' "$RUNNER_TEMP/base/Makefile"; then
            echo "Base benchmarks skipped: the base has no bench target." >> "$RUNNER_TEMP/notes.md"
          elif ! make -C "$RUNNER_TEMP/base" bench BENCH_OUT="$RUNNER_TEMP/base.txt" > /dev/null; then
            echo "**Base benchmarks failed**; the base column may be partial." >> "$RUNNER_TEMP/notes.md"
          fi
      - name: Benchmarks on the head
        run: |
          if ! make bench BENCH_OUT="$RUNNER_TEMP/head.txt" > /dev/null; then
            echo "**Head benchmarks failed**; see the log of this step. The head column may be partial." >> "$RUNNER_TEMP/notes.md"
          fi
      - name: Compare
        if: always()
        env:
          GOFLAGS: ""
        run: |
          touch "$RUNNER_TEMP/base.txt" "$RUNNER_TEMP/head.txt" "$RUNNER_TEMP/notes.md"
          {
            echo '## Benchmarks, base against head'
            echo
            cat "$RUNNER_TEMP/notes.md"
            echo
            echo '```'
            go run golang.org/x/perf/cmd/benchstat@v0.0.0-20261117185222-4febdb082b2c \
              base="$RUNNER_TEMP/base.txt" head="$RUNNER_TEMP/head.txt" || echo "benchstat failed"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Mutants of the guards and condition operands on the lines a pull
  # request changes, tested against their package's tests (scripts/mutate).
  # The survivors, guards no test needs, go to the job summary. Report
  # only: the job never fails the build.
  mutate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    env:
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          # Off for the same reason as the fuzz jobs: this job would save
          # under the test job's cache key first.
          cache: false
      # The same pinned registry as the test job: with CI set, the tests of
      # internal/facts, internal/merge, internal/registry and cmd/mtf-facts
      # fail without it, and every mutant there would read "baseline failed".
      - name: Fetch rule registry
        run: |
          curl -fsSL --proto '=https' --tlsv1.2 --retry 2 --max-time 30 \
            -o "$RUNNER_TEMP/rule-facts.md" \
            "https://raw.githubusercontent.com/modulestf/modulestf/${SKILLS_COMMIT}/.agents/skills/terraform-module-reviewer/references/rule-facts.md"
          echo "${REGISTRY_SHA256}  ${RUNNER_TEMP}/rule-facts.md" | sha256sum -c -
      # The checkout is the pull request's merge ref, on the base branch's
      # current tip, so HEAD^1 is that tip. github.event.pull_request.base.sha
      # is where the branch was cut and does not follow the base branch: a
      # diff from it would also mutate the base branch's later commits.
      - name: Mutants on changed lines
        env:
          MTF_FACTS_REGISTRY: ${{ runner.temp }}/rule-facts.md
        run: go run ./scripts/mutate -base HEAD^1 -budget 9m -summary "$GITHUB_STEP_SUMMARY"

  # Releases ship darwin binaries, and the tree reader and the read caps are
  # built only for unix, so the suite runs on macOS too.
  test-macos:
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true
      # The same pinned registry as the test job; shasum, since macOS has no
      # sha256sum.
      - name: Fetch rule registry
        run: |
          curl -fsSL --proto '=https' --tlsv1.2 --retry 2 --max-time 30 \
            -o "$RUNNER_TEMP/rule-facts.md" \
            "https://raw.githubusercontent.com/modulestf/modulestf/${SKILLS_COMMIT}/.agents/skills/terraform-module-reviewer/references/rule-facts.md"
          echo "${REGISTRY_SHA256}  ${RUNNER_TEMP}/rule-facts.md" | shasum -a 256 -c -
      - name: Test
        env:
          MTF_FACTS_REGISTRY: ${{ runner.temp }}/rule-facts.md
        run: go test -race -count=1 ./...

  # Each fuzz target of the parsers of untrusted input runs for 30 s from its
  # seed corpus. A failing input is uploaded so it can be added to testdata.
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target:
          - { pkg: ./internal/facts, name: FuzzParseSyntax }
          - { pkg: ./internal/facts, name: FuzzParseFile }
          - { pkg: ./internal/facts, name: FuzzDiffBaseGitHubFiles }
          - { pkg: ./internal/facts, name: FuzzDiffBaseUnified }
          - { pkg: ./internal/facts, name: FuzzReadYAML }
          - { pkg: ./internal/facts, name: FuzzChangesFile }
          - { pkg: ./internal/registry, name: FuzzParse }
          - { pkg: ./internal/profile, name: FuzzNew }
          - { pkg: ./internal/fixture, name: FuzzFile }
          - { pkg: ./internal/schema, name: FuzzHandoff }
          - { pkg: ./internal/merge, name: FuzzParseReply }
          - { pkg: ./internal/schema, name: FuzzNullScan }
          - { pkg: ./internal/schema, name: FuzzRawSchema }
    env:
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          # Off on purpose: setup-go keys its cache on the OS, Go version
          # and go.sum alone, so these short jobs would save under the test
          # job's key first and leave it a cache without the race build.
          cache: false
      - name: Fuzz
        env:
          PKG: ${{ matrix.target.pkg }}
          NAME: ${{ matrix.target.name }}
        run: go test -run '^$' -fuzz "^${NAME}\$" -fuzztime 30s "$PKG"
      - name: Upload failing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target.name }}
          path: ${{ matrix.target.pkg }}/testdata/fuzz
          if-no-files-found: ignore
