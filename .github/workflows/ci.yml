name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Check modules
        env:
          GOFLAGS: ""
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: Vulnerabilities
        env:
          GOFLAGS: ""
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Vet
        run: go vet ./...
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      # The rule registry, from the public modulestf repository at a pinned
      # commit, with no token. TestRulesMatchPinnedRegistry checks the
      # `mtf-facts rules` listing against it. A registry change is published
      # there first and then picked up here by bumping the commit and the
      # file's SHA-256 together. The hash check refuses a cut-off download.
      - name: Fetch rule registry
        env:
          SKILLS_COMMIT: 38039224c9a69ec93ff77f41abc9e31147ddebd1
          REGISTRY_SHA256: c8859bd5d18ecc4c846cf74b246ad4307f8f6899c43c706af34d07d58fd59a00
        run: |
          curl -fsSL --proto '=https' --tlsv1.2 --retry 2 --max-time 30 \
            -o "$RUNNER_TEMP/rule-facts.md" \
            "https://raw.githubusercontent.com/modulestf/modulestf/${SKILLS_COMMIT}/.agents/skills/terraform-module-reviewer/references/rule-facts.md"
          echo "${REGISTRY_SHA256}  ${RUNNER_TEMP}/rule-facts.md" | sha256sum -c -
      - name: Test
        env:
          MTF_FACTS_REGISTRY: ${{ runner.temp }}/rule-facts.md
        run: go test -race -count=1 ./...
      - name: Build
        run: go build -trimpath -o bin/mtf-facts ./cmd/mtf-facts
      # ajv-cli and its dependencies come from tests/ajv/package-lock.json,
      # installed by npm ci from the public registry with no token. The
      # image's Node.js is used on purpose: ajv-cli 5 runs on any current Node.
      - name: Schemas
        run: bash tests/schemas-test.sh
