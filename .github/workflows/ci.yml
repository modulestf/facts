name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  GOFLAGS: -mod=vendor

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Check vendor
        env:
          GOFLAGS: -mod=mod
        run: |
          go mod verify
          go mod vendor
          git diff --exit-code -- vendor go.mod go.sum
          test -z "$(git status --porcelain --untracked-files=all -- vendor go.mod go.sum)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...
      - name: Build
        run: go build -trimpath -o bin/mtf-facts ./cmd/mtf-facts
