name: release

# A pushed version tag builds the binaries, attests their provenance and
# publishes them with a SHA256SUMS file. scripts/build-release.sh does the
# build, so scripts/verify-release.sh can rebuild the same bytes anywhere.
# Each job holds only the permission its step needs: the build has no token
# that can sign or write, the attestation runs in the release environment,
# and only the last job can write to the repository.

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Check the tag is on master
        env:
          TAG: ${{ github.ref_name }}
        run: |
          commit=$(git rev-parse "refs/tags/${TAG}^{commit}")
          if ! git merge-base --is-ancestor "$commit" origin/master; then
            echo "::error::${TAG} points to ${commit}, which is not on master"
            exit 1
          fi
      # build-release.sh sets GOTOOLCHAIN from .go-version itself; setup-go
      # installs that same version, so no toolchain is downloaded here.
      - name: Build
        env:
          TAG: ${{ github.ref_name }}
        run: ./scripts/build-release.sh "$TAG" "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 1

  attest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Check the artifact
        working-directory: dist
        run: sha256sum -c SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

  release:
    needs: attest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        working-directory: dist
        run: |
          sha256sum -c SHA256SUMS
          prerelease=()
          if [[ $TAG == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$TAG" --generate-notes "${prerelease[@]}" \
            mtf-facts_* SHA256SUMS
